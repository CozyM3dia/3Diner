name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: App

jobs:
  verify:
    name: typecheck · test · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build-time placeholders only. Every page under /dashboard is
    # force-dynamic, so nothing queries Supabase during `next build` —
    # these exist purely so module-level env reads do not throw.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Start local Supabase stack
        run: npx supabase@2.115.0 start

      - name: Reset local Supabase database
        run: npx supabase@2.115.0 db reset --local --yes

      - name: Test
        run: npm run test:ci

      # Ratchet, not a full sweep: main currently carries 39 pre-existing
      # eslint errors (mostly react-hooks/set-state-in-effect and explicit
      # any in the 3D viewer). Gating the whole repo would fail every PR on
      # day one, so this blocks only on files the PR actually touches. The
      # backlog is tracked separately — see docs/optimization-review.md.
      - name: Lint changed files
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ref; linting the full App/src tree instead."
            npx eslint src tests
            exit $?
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'App/**/*.ts' 'App/**/*.tsx' 'App/**/*.mjs' | sed 's|^App/||')
          if [ -z "$files" ]; then
            echo "No JS/TS files changed."
            exit 0
          fi
          echo "$files"
          echo "$files" | xargs npx eslint

      - name: Build
        run: npm run build

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase@2.115.0 stop
