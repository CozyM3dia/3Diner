<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>3Diner - Pilih Pembayaran</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#001c3b",
                        "on-secondary-container": "#2f4e84",
                        "inverse-surface": "#2d3133",
                        "primary-fixed-dim": "#ffb59d",
                        "on-surface-variant": "#5a4139",
                        "background": "#F6F8FB", // Using Paper White as default background
                        "surface-bright": "#f7f9fc",
                        "on-primary-fixed": "#390b00",
                        "error": "#ba1a1a",
                        "surface-container": "#eceef1",
                        "on-primary": "#ffffff",
                        "soft-surface": "#E0E7EE",
                        "on-primary-container": "#fffbff",
                        "surface-variant": "#e0e3e6",
                        "orange-blush": "#FDE8DC",
                        "on-primary-fixed-variant": "#832600",
                        "secondary": "#405e94",
                        "secondary-fixed": "#d7e2ff",
                        "tertiary": "#455d82",
                        "surface": "#f7f9fc",
                        "inverse-on-surface": "#eff1f4",
                        "on-tertiary-fixed-variant": "#2f476b",
                        "on-secondary-fixed": "#001a40",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline": "#8e7067",
                        "on-tertiary-container": "#fefcff",
                        "tertiary-fixed-dim": "#afc8f2",
                        "whisper-border": "#CFD9E4",
                        "primary": "#a83300",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e6",
                        "tertiary-fixed": "#d5e3ff",
                        "orange-warm": "#F05A22", // Adjusted to match prompt's orange
                        "on-secondary": "#ffffff",
                        "midnight-navy": "#022C60", // Adjusted to match prompt's navy
                        "on-secondary-fixed-variant": "#26467b",
                        "secondary-container": "#a3c1fe",
                        "primary-fixed": "#ffdbd0",
                        "inverse-primary": "#ffb59d",
                        "outline-variant": "#e2bfb4",
                        "surface-dim": "#d8dadd",
                        "surface-container-low": "#f2f4f7",
                        "surface-tint": "#ac3400",
                        "primary-container": "#d04408",
                        "tertiary-container": "#5d759c",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e6e8eb",
                        "secondary-fixed-dim": "#acc7ff",
                        "pure-surface": "#FDFDFD",
                        "on-background": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "chip-gap": "8px",
                        "card-gap": "12px",
                        "touch-target-min": "44px",
                        "section-margin": "32px",
                        "page-gutter": "16px"
                    },
                    "fontFamily": {
                        "caption": ["Plus Jakarta Sans"],
                        "section-header": ["Plus Jakarta Sans"],
                        "body-main": ["Plus Jakarta Sans"],
                        "badge-micro": ["Plus Jakarta Sans"],
                        "headline-h2": ["Plus Jakarta Sans"],
                        "price-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "headline-h1": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "caption": ["11px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "section-header": ["18px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "body-main": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "badge-micro": ["10px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "headline-h2": ["22px", { "lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "price-lg": ["20px", { "lineHeight": "1", "fontWeight": "700" }],
                        "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "headline-h1": ["28px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F6F8FB;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-midnight-navy min-h-screen flex flex-col md:hidden max-w-[375px] mx-auto relative overflow-x-hidden">
<!-- Top Confirmation Banner -->
<div class="bg-midnight-navy w-full pt-8 pb-8 px-page-gutter rounded-b-[24px]">
<div class="flex flex-col items-start mt-8">
<div class="w-10 h-10 bg-orange-warm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<h1 class="font-headline-h2 text-[20px] text-white mt-3">Pesanan Terkirim!</h1>
<p class="font-body-main text-[13px] text-white/75 mt-1">Pesananmu sudah masuk ke dapur Senja Kopi</p>
<div class="flex gap-2 mt-4">
<span class="px-3 py-1 bg-white/10 text-white text-[12px] rounded-full">No. Pesanan #SJ-0241</span>
<span class="px-3 py-1 bg-white/10 text-white text-[12px] rounded-full">Meja 12</span>
</div>
</div>
</div>
<!-- Order Mini-Summary -->
<div class="bg-pure-surface border border-whisper-border rounded-[16px] p-4 mx-page-gutter mt-6 shadow-[0_4px_12px_rgba(2,44,96,0.05)]">
<div class="flex justify-between items-center">
<span class="font-body-main text-[13px] text-tertiary-container">3 item · Total</span>
<span class="font-price-lg text-[18px] text-orange-warm">Rp 110.000</span>
</div>
<button class="font-body-main text-[12px] text-orange-warm mt-2 text-left hover:text-orange-warm/80 transition-colors">Lihat rincian</button>
</div>
<!-- Section Label -->
<h2 class="font-section-header text-[16px] text-midnight-navy px-page-gutter mt-6">Pilih Metode Pembayaran</h2>
<!-- Payment Method Cards -->
<div class="flex flex-col gap-3 px-page-gutter mt-4">
<!-- Card A - CASH -->
<button class="w-full bg-pure-surface border border-whisper-border rounded-[16px] p-4 flex items-center text-left hover:bg-surface-bright transition-colors active:scale-[0.98]">
<div class="w-[44px] h-[44px] rounded-full bg-soft-surface flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-midnight-navy">account_balance_wallet</span>
</div>
<div class="flex-1 px-3">
<h3 class="font-bold text-[15px] text-midnight-navy leading-tight">Bayar di Kasir</h3>
<p class="font-body-main text-[12px] text-tertiary-container mt-1 leading-snug">Tunjukkan kode pesanan ke kasir, bayar tunai</p>
</div>
<span class="material-symbols-outlined text-midnight-navy shrink-0">chevron_right</span>
</button>
<!-- Card B - QRIS -->
<button class="w-full bg-pure-surface border-[1.5px] border-orange-warm rounded-[16px] p-4 flex items-center text-left hover:bg-orange-blush/20 transition-colors active:scale-[0.98] shadow-[0_4px_12px_rgba(240,90,34,0.08)]">
<div class="w-[44px] h-[44px] rounded-full bg-orange-blush flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-orange-warm">qr_code_2</span>
</div>
<div class="flex-1 px-3">
<h3 class="font-bold text-[15px] text-midnight-navy leading-tight">Bayar dengan QRIS</h3>
<p class="font-body-main text-[12px] text-tertiary-container mt-1 leading-snug">Scan &amp; bayar langsung, semua e-wallet &amp; bank</p>
</div>
<div class="flex items-center gap-2 shrink-0">
<span class="px-2 py-0.5 bg-orange-blush text-orange-warm font-badge-micro text-[10px] rounded-full">CEPAT</span>
<span class="material-symbols-outlined text-midnight-navy">chevron_right</span>
</div>
</button>
</div>
<!-- Security Reassurance -->
<div class="flex items-center justify-center gap-1 mt-6 mb-8 text-tertiary-container">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-caption text-[11px]">Pembayaran aman &amp; terenkripsi</span>
</div>
</body></html>
