<style>
        .orbit-ring {
            border: 2px dotted #455d82;
            border-radius: 50%;
            width: 320px;
            height: 320px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg);
            pointer-events: none;
            animation: spin 20s linear infinite;
        }
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-midnight-navy text-on-tertiary h-screen w-screen overflow-hidden flex flex-col font-body-main antialiased selection:bg-orange-warm selection:text-white">
<!-- Hexagonal Background & 3D Canvas Container -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_#022C60_0%,_#002355_100%)] flex items-center justify-center">
<!-- Guide Ring -->
<div class="absolute w-[300px] h-[300px] rounded-full border border-white opacity-6 pointer-events-none"></div>
<!-- Glow Effect -->
<div class="absolute w-[250px] h-[250px] bg-secondary-fixed-dim/20 blur-[80px] rounded-full pointer-events-none"></div>
<!-- Orbit Ring -->
<div class="orbit-ring"></div>
<!-- Floating Coffee Cup (Placeholder for 3D model) -->
<div class="relative z-10 w-full h-[60vh] flex flex-col items-center justify-center animate-[bounce_4s_infinite_alternate_ease-in-out]">
<img class="h-full w-auto object-contain mix-blend-screen relative z-10" data-alt="A highly detailed, photorealistic 3D rendering of an iced latte coffee in a premium clear plastic cup. The cup features beautiful condensation droplets and swirling layers of milk and espresso. The lighting is cinematic, highlighting the warm amber tones of the coffee against a dark, moody background. The aesthetic is modern, tactile, and appetizing, fitting perfectly within a high-end corporate food app design system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuClaf1i452pM7uBHgA95NIfXxvXROUhx4BJVuHy7P4_xGN7EQqz7Rb2fl9arKo787234JelxJ8l0sP4N1LQp0rIAs29A6-XBUOE7MF31Pq1lGKJVyoejYliOUamNtC_MMfSRqtHt1QI11qwCXYpzoG4SLECS6fM_MQebM6K_Q0eT6gtIgRkRjDRGX4gUotgEGJjpPL17bq8VX02b9pyXjzginSfiHiVC4JiUjRpNImt44_rocEJX7_FeuTdmRRYUVo4M-hpM_4xMbo"/>
<!-- Contact Shadow -->
<div class="absolute -bottom-8 w-[160px] h-[20px] bg-[#F05A22]/30 blur-xl rounded-[100%] pointer-events-none z-0"></div>
</div>
<!-- Gesture Hints -->
<div class="absolute bottom-[28%] w-full flex justify-between px-12 z-10 opacity-70">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">swipe</span>
<span class="font-caption text-caption text-secondary-fixed-dim">Seret untuk putar</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 0;">pinch</span>
<span class="font-caption text-caption text-secondary-fixed-dim">Cubit untuk zoom</span>
</div>
</div>
</div>
<!-- Top Bar -->
<header class="relative z-20 flex justify-between items-center h-16 px-page-gutter w-full">
<button aria-label="Back" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-white hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2-mobile text-white tracking-tight">Kopi Susu Senja</h1>
<button aria-label="Share" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-white hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">share</span>
</button>
</header>
<!-- Spacer to push bottom panel down -->
<div class="flex-grow z-10 relative"></div>
<!-- Bottom Control Panel (AR Sheet) -->
<div class="relative z-20 bg-midnight-navy/90 backdrop-blur-xl w-full rounded-t-xl p-6 flex flex-col gap-6 shadow-[0_-10px_40px_rgba(2,44,96,0.5)] border-t border-on-tertiary-fixed-variant">
<!-- Info Row -->
<div class="flex justify-between items-end border-b border-on-tertiary-fixed-variant pb-4">
<div class="flex flex-col">
<h2 class="font-section-header text-section-header text-white">Kopi Susu Senja</h2>
<p class="font-label-caps text-label-caps text-tertiary uppercase mt-1">KOPI</p>
</div>
<span class="font-price-lg text-price-lg text-[#F05A22]">Rp 28.000</span>
</div>
<!-- 3D Controls Row -->
<div class="flex justify-around items-center py-2">
<button aria-label="Reset View" class="flex flex-col items-center gap-1 text-white hover:text-[#F05A22] transition-colors w-touch-target-min h-touch-target-min justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">restart_alt</span>
<span class="font-caption text-caption">Reset</span>
</button>
<button aria-label="Scale Model" class="flex flex-col items-center gap-1 text-white hover:text-[#F05A22] transition-colors w-touch-target-min h-touch-target-min justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">aspect_ratio</span>
<span class="font-caption text-caption">Skala</span>
</button>
<button aria-label="Lighting Controls" class="flex flex-col items-center gap-1 text-white hover:text-[#F05A22] transition-colors w-touch-target-min h-touch-target-min justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lightbulb</span>
<span class="font-caption text-caption">Cahaya</span>
</button>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-3">
<button class="w-full h-[52px] bg-[#F05A22] text-white rounded font-label-caps text-label-caps tracking-widest uppercase flex items-center justify-center gap-2 shadow-[0_6px_20px_rgba(240,90,34,0.28)] hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
                MODE AR
            </button>
<p class="font-caption text-caption text-center text-secondary-fixed-dim">Pindai ruang sekitar untuk Mode AR</p>
</div>
<!-- Safe Area Padding for mobile -->
<div class="pb-safe"></div>
</div>
</body></html>
