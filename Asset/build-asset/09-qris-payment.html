<body class="bg-background text-on-surface font-body-main min-h-screen flex flex-col max-w-[375px] mx-auto relative antialiased">
<!-- HEADER -->
<header class="flex items-center justify-between px-page-gutter h-[64px] border-b border-whisper-border bg-pure-surface shrink-0">
<button aria-label="Back" class="w-[44px] h-[44px] flex items-center justify-center -ml-2 text-midnight-navy">

</div>

<span class="font-bold text-[14px] text-midnight-navy tracking-tight">QRIS</span>
<span class="font-caption text-muted-navy">Senja Kopi</span>
</div>
<div class="w-[200px] h-[200px] bg-white border border-whisper-border rounded-lg mb-6 flex items-center justify-center overflow-hidden">

<p class="font-caption text-[11px] text-muted-navy text-center max-w-[220px]">

            </p>
</div>

<div class="bg-orange-blush rounded-full flex items-center px-4 py-2 gap-2">
<span class="material-symbols-outlined text-orange-text text-[18px]" style="font-variation-settings: 'FILL' 0;">schedule</span>
<span class="font-body-main text-[13px] font-semibold text-orange-text">Bayar dalam 04:58</span>
</div>
</div>
