<style>
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .scan-line {
            animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-50vh) scaleX(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(50vh) scaleX(1.2); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-black text-on-primary font-body-main-mobile h-screen w-full max-w-[375px] mx-auto overflow-hidden relative">
<!-- AR Camera Passthrough Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="A POV shot looking down at a rustic wooden cafe table. The lighting is warm and inviting, typical of a cozy coffee shop with soft natural light streaming in. The table surface has rich textures and natural wood grains. The scene is slightly blurred to simulate an out-of-focus background for augmented reality passthrough. The overall aesthetic is warm, tactile, and highly realistic, fitting a premium dining app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAC8jsscisvyUyLi-7itYs9ntCNrrisL96v-cpAao_OSyApeUx9KRK9d4mNUqGNqZBTTEt9EEtCd0lHx0NWi2EMzSFpGOHlQ3egMnGvVWumAVFNB3aOIisNIYPk0K4T7iFCwo96ENQHI0OI_EWlKLIlWWhrzRTJTT36BvCHwQki50clFlbuLTxxhg1TvLQPgYiljpQqGk9aH8uPz3iYkU1ByzAvYXSpyh8eaTV79R373y1tuCPYVTFVRSEdeZPL_ekoeS0oFtWMT2Q"/>

<img class="w-48 h-48 object-contain translate-y-12 drop-shadow-xl" data-alt="A highly realistic 3D render of an iced latte in a clear glass on the wooden table. The glass is sweating slightly with condensation. The coffee has distinct layers of dark espresso and creamy milk. It casts a soft, realistic shadow on the table surface, perfectly matching the warm cafe lighting. The style is highly appetizing, photorealistic, and fits seamlessly into the environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDi-s5UhqALH86beRyD8ZazKVdw2eu-J9SCw57HSQ34HnKeX1Lh8lhWdjWb2I7MaVQopa47Fs7cGpD1jgOb3PAm5NyVkuD0LbrKToKiCXfIPvV1JkSXegBIhsHtZm-DQ1gdx0hhZ9HS_vuasbAadqm4i1ne43IbTq74t_KM6jcl6wpgXYv7LhKBM2Bn-SFpEZSa0qA7CgMlFnMUX4e9WnpRp_oMxSiyViNvda0iRVW53O8KHy4-OVAu3-JvGrMUca7a0htrdVxgjrM"/>
</div>
</div>
<!-- Scanning Line Effect -->
<div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center overflow-hidden">
<div class="w-3/4 h-[2px] bg-orange-warm shadow-[0_0_15px_rgba(240,112,66,0.8)] rounded-full scan-line relative">
<div class="absolute inset-0 bg-white opacity-50 blur-sm rounded-full"></div>
</div>
</div>
<!-- UI Layer -->
<div class="absolute inset-0 z-20 flex flex-col justify-between pointer-events-none">
<!-- Top UI -->
<div class="flex justify-between items-start pt-safe px-page-gutter mt-4 pointer-events-auto">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center bg-midnight-navy/60 backdrop-blur-md rounded-full text-white hover:bg-midnight-navy/80 transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex items-center gap-2 bg-midnight-navy/60 backdrop-blur-md px-4 py-2 rounded-full border border-whisper-border/20 shadow-lg">
<div class="w-2 h-2 rounded-full bg-green-500 pulse-dot"></div>
<span class="font-label-caps-mobile text-label-caps-mobile text-white tracking-widest">AR AKTIF</span>
</div>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Spacer for centering -->
</div>
<!-- Center Guidance -->
<div class="flex-grow flex items-center justify-center">
<div class="bg-midnight-navy/80 backdrop-blur-md px-6 py-3 rounded-full shadow-2xl border border-whisper-border/10 transform -translate-y-8 animate-pulse">
<p class="font-caption-mobile text-caption-mobile text-white opacity-90 text-center tracking-wide">Ketuk meja untuk meletakkan hidangan</p>
</div>
</div>
<!-- Bottom Panel -->

<div class="flex justify-between items-center mb-6">
<div>

<p class="font-price-lg-mobile text-price-lg-mobile text-orange-warm">Rp 28.000</p>
</div>
<div class="flex gap-4">
<button class="flex flex-col items-center justify-center gap-1 group active:scale-95 transition-transform">
<div class="w-touch-target-min h-touch-target-min bg-white/10 rounded-full flex items-center justify-center group-hover:bg-white/20 transition-colors border border-white/5">
<span class="material-symbols-outlined text-white" data-icon="photo_camera">photo_camera</span>
</div>
<span class="font-badge-micro-mobile text-badge-micro-mobile text-tertiary-fixed-dim">FOTO</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 group active:scale-95 transition-transform">
<div class="w-touch-target-min h-touch-target-min bg-white/10 rounded-full flex items-center justify-center group-hover:bg-white/20 transition-colors border border-white/5">
<span class="material-symbols-outlined text-white" data-icon="aspect_ratio">aspect_ratio</span>
</div>
<span class="font-badge-micro-mobile text-badge-micro-mobile text-tertiary-fixed-dim">UKURAN</span>
</button>
</div>
</div>
</div>
</div>
